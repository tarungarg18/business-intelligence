[project]
name = "verity"
version = "0.1.0"
description = "KPI Intelligence-to-Action Engine — Accenture Innovation Challenge 2026, Track 3"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repository root on sys.path so `import verity` works without
# installing the package or exporting PYTHONPATH.
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:duckdb",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
